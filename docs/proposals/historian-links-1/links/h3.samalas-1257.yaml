id: x.hist.samalas-1257
filed_by: Historian
date: "2026-11-18"
status: proposal
link_type: mechanism
fields: [physics/volcanology, climate, history]
pattern_a: "Volcanology: the c.1257 ice-core sulfate spike (largest volcanic sulfur release to the stratosphere in the past 7,000 years) comes from Samalas, Lombok; eruption between May and October 1257, column up to 43 km, at least 40 km3 DRE (Lavigne et al. 2013)."
pattern_b: "History: the English food crisis of 1258, with bad weather, failed harvests, famine refugees in London and mass graves at St Mary Spital (Campbell 2017)."
mechanism: "Stratospheric sulfate -> cooling and unstable weather -> harvest failure -> famine. Lavigne et al. report that tree rings, medieval chronicles and models corroborate worldwide climatic effects."
steps:
  - {step: "Samalas = source of the 1257/58 sulfate spike", label: established, sources: [lavigne2013]}
  - {step: "eruption -> global climatic effects", label: "established (corroborated by tree rings, chronicles, models)", sources: [lavigne2013]}
  - {step: "eruption -> English famine of 1258", label: "mainstream hypothesis, open: Campbell 2017 weighs Samalas against strong solar forcing and says the answer depends on the precise chronology", sources: [campbell2017]}
label: "established for the volcanology and climate steps; CONTESTED for the climate -> 1258 English famine step"
atlas_label_if_adopted: CONTESTED
sources: [lavigne2013, campbell2017]
breaks_if:
  - "Documentary price and harvest records show the English harvest failure starting before any climatic effect of a May-October 1257 eruption could arrive (i.e. the 1256 or early-1257 harvests already failed at crisis level)."
  - "High-resolution proxies attribute the 1257-58 weather anomaly to solar forcing, with no volcanic cooling signal in England's growing season."
