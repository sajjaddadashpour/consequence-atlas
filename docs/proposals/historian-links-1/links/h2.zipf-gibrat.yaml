id: x.hist.zipf-gibrat
filed_by: Historian
date: "2026-11-18"
status: proposal
link_type: shared-form   # same mathematics, not one causal mechanism
fields: [history/economics (cities), biology (species/genera), physics (stochastic processes)]
pattern_a: "Cities: the number of cities larger than S is roughly proportional to 1/S (Zipf's law, exponent 1) in many countries (Gabaix 1999)."
pattern_b: "Other fields: proportional ('size-independent') growth processes give skew, power-law-like size distributions; Simon 1955 derives this class and applies it to word frequencies, city sizes, incomes and biological genera by species number."
mechanism: "Gabaix 1999: if, at least in the upper tail, all cities grow by the same proportional random process (Gibrat's law: growth rate independent of size), the size distribution converges to Zipf's law. Same mathematics as Simon's 1955 proportional-growth model; the link across fields is the shared stochastic process, not a shared cause."
label: "Zipf regularity: mainstream, empirically contested (estimator-dependent); Gibrat explanation: mainstream hypothesis; cross-field identity: same mathematics only"
atlas_label_if_adopted: CONTESTED
sources: [gabaix1999, soo2005, simon1955]
exceptions_verified: "Soo 2005 (73 countries): Zipf's law rejected for 53 of 73 countries with OLS and for 30 of 73 with the Hill estimator (abstract, identical in the published RePEc record and the CEP DP 641 version). With Hill, 43 of 73 (59%) are not significantly different from 1; 24 significantly above and 6 below (CEP DP 641 text). Exponent variation is better explained by political-economy than economic-geography variables."
correction_to_room: "Historian said in the room that Zipf 'holds in fewer than half of the 73 countries'. That is true only with OLS (not rejected in 20/73). With the Hill estimator, which Soo treats as having the correct standard errors, it is not rejected in 43/73. The honest statement: rejected far more often than chance under both estimators."
breaks_if:
  - "City growth rates measured to depend systematically on size in the upper tail, in a country where Zipf still holds (Gibrat fails, Zipf holds: the explanation is wrong)."
  - "Gibrat holds in the upper tail but the size distribution is far from exponent 1 (explanation insufficient). Soo's political-economy dependence of the exponent is already partial evidence of this."
notes: "Shared form only. Do not claim cities, firms and genera share a cause."
