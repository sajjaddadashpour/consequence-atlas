id: backward.carers
name: Backward chain from 'beings who can care exist'
bridge_premises:
- 'B1 (bridge, philosophical): caring requires a lasting self, memory of the past and anticipation of the future.'
- 'B2 (bridge, IMPORTED physics): memory requires records, which require an arrow of time (arrow >= 1).'
- 'B3 (bridge, CONJECTURE): a lasting self requires stable, complex bodies, i.e. chemistry (S6) with C/O or substitutes.'
- 'B4 (IMPORTED/DERIVED, firm conditions, each the FAIL edge of a forward link): chemistry, stars and records need n = 3 (l.s03.gravity-orbits, l.s09.planet-orbits); non-relativistic atoms, alpha < 1/3 (l.s04.nonrelativistic-atoms, CONTESTED from 0.2); hydrogen stable, which is a joint alpha-beta condition (l.s05.hydrogen-stable, DERIVED-UNDER-ASSUMPTION): m_n - m_p = Q + E*alpha/alpha0 must exceed m_e = beta*m_p, FAIL when beta*m_p > 2.814 MeV - 0.843 MeV*alpha/alpha0, i.e. beta > ~0.0021 at our alpha and alpha > ~0.0199 at our beta (alpha > ~0.0243 as beta -> 0); CONTESTED from beta > ~0.00114 or alpha > ~0.0108 at ours; the stellar Coulomb floor alpha^2*beta >= 2.62e-12 (l.s07.coulomb-barrier, alpha >~ 6.9e-5 at our beta); the star-mass window beta/alpha^2 >= 10^(-8/3) (l.s07.star-mass-window, CONTESTED below 1/100); beta < 1/81 (l.s06.nuclei-still; pre-empted by hydrogen); carbon nuclei and table length (l.s05.carbon-nuclei, l.s05.table-length) are pre-empted by hydrogen in the dial ranges. Every bound that involves beta moves with alpha and vice versa; none is valid only at our values.'
- 'B5 (IMPORTED): energy and elements require galaxies, stars and the pp chain: Lambda below the l.s07g.lambda-galaxies bound (DERIVED-UNDER-ASSUMPTION); strong change s < +0.5 (l.s08.pp-chain FAIL at s >= 0.5; CONTESTED outside -4% <~ s <~ +3.4%); Hoyle window contested (l.s08.hoyle-window); for negative Lambda, a firm floor Lambda >= -53.9 x ours (l.s11.lambda-lifetime FAIL, 5 Gyr benchmark) and, CONTESTED, Lambda >= -7.09 x ours if observers need as long as they took here.'
is_ought_gap: 'Nothing here derives an ''ought''. The chain only says: IF beings who can care exist, THEN these physical conditions held (given the bridges). Each bridge is labelled; B1 and B3 are not physics.'
