id: x.brakes-backfire
a:
  field: chemistry
  pattern: "Gel effect / Norrish-Trommsdorff autoacceleration: in a free-radical polymerization, termination is diffusion-limited. As conversion rises, so does viscosity; termination then slows more than propagation, the radical population grows, and the rate and the heat output run away. This is a runaway that starts when a brake weakens. It has no inverted-U optimum."
b:
  field: history
  pattern: "Security dilemma: one state arms, or otherwise builds up, in order to feel safer. Its neighbour reads that move as a threat and arms too. Both end up less safe than before. In Jervis's account the dilemma is strongest when offence has the advantage and offensive and defensive arms are indistinguishable."
connection: "These rows share a verbal pattern, not a shared derivation: a control meant to restrain something ends up increasing it, or otherwise defeating the aim. No common model is claimed. The gel effect and the security dilemma are both positive feedback triggered by a safety step; that parallel is an analogy unless it is written as one reaction-equation model. Two further rows of the same verbal pattern are recorded in notes: the 1902 Hanoi rat bounty (metric gaming) and contested risk compensation (Peltzman 1975)."
label: ANALOGY-ONLY
support: analogy
claim: pattern
breaks_if: "Not breakable as a cause, because it claims none. It is retired if the negative analogy grows to cover the positive one, or upgraded only if someone writes a common model that makes a locked, distinctive prediction and that prediction holds."
analogy:
  positive:
  - "In each row, a control or safety step meant to restrain something ends up increasing it, or otherwise defeating the aim."
  - "The gel effect and the security dilemma are both positive feedback triggered by a safety step."
  negative:
  - "The gel effect is a laboratory-confirmed physical runaway when a diffusion-limited brake weakens; it has no inverted-U optimum and no intentional agent."
  - "The security dilemma is a strategic interaction between states, and the fit of well-known cases, including the Anglo-German naval race before 1914, is contested."
  - "The Hanoi 1902 row is metric gaming (a reward paid for a proxy), not a weakening brake and not a case of too much correction."
  - "Risk compensation is a contested behavioral offset to safety regulation, not a physical or strategic runaway of the same kind."
  - "No shared derivation or common reaction-equation model is claimed."
  neutral:
  - "Whether a single reaction-equation model can cover the gel effect and the security dilemma and make a locked, distinctive prediction."
