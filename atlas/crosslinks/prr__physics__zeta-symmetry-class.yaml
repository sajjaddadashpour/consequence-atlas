notes: "Forge verdict REDUCES-TO-KNOWN (H1-LOCK section 5, rule 3; SURVIVED was not an available outcome). Files: docs/forge/2026-11-23-math-h1-h3/ (H1-LOCK.md, code/h1_run.py, out/h1_output.txt). Classification rule: tol = max(3 SE, 0.010) around the Atas references; largest size only (N=2000; chains L=12). Seen replication #10^12 window gave 0.6000 (GUE) and cannot confirm anything. Instruments passed: Gaussian GOE 0.5359, Gaussian GUE 0.5953 at N=2000. Smaller sizes (reported as trend, not classified) range up to 0.5373 for dense real +-1 at N=500. The real chain at L=12 has only 4 samples (SE 0.0256). The complex chain control gave 0.6087 (GUE). Montgomery 1973 is cited through Atas et al. 2013; its own record was not checked. The forge verdict word is recorded here, not as an atlas label."
