id: x.landauer-erasure
a:
  field: physics
  pattern: "Logically irreversible erasure of one bit in a system at temperature T dissipates at least k_B T ln 2 of heat (0.018 eV at 300 K)."
  refs:
  - l.s10.landauer
b:
  field: biology
  pattern: "A cell that resets a stored internal state (for example a receptor that forgets its last reading so it can sense again) must dissipate at least that bound per bit erased."
connection: "Same physical process in both systems: the second law applied to a many-to-one map on a memory register. Landauer derived the bound; Berut et al. measured it with a colloidal bit; Mehta and Schwab apply the same thermodynamics to a cellular sensing network."
label: ESTABLISHED
support: mechanism
claim: cause
breaks_if: "A measured erasure, in any carrier, dissipating reliably less than k_B T ln 2 per bit with the full environment accounted for."
sources:
- landauer1961
- berut2012
- mehta-schwab2012
status: active
proposed_by: philosopher
steps:
- from: logically irreversible erasure of one bit
  to: dissipation of at least k_B T ln 2 per bit
  label: ESTABLISHED
  support: mechanism
  evidence_rung: 3
  rung_basis: "Landauer (1961) derived the k_B T ln 2 bound as a prediction; Berut et al. (2012) confirmed it experimentally with a colloidal bit."
  locked_prediction:
    predicted_by: landauer1961
    confirmed_by: berut2012
  sources:
  - landauer1961
  - berut2012
- from: dissipation of at least k_B T ln 2 per bit
  to: cell computation is bounded below by kT ln2 per bit erased
  label: ESTABLISHED
  support: mechanism
  evidence_rung: 3
  rung_basis: "The bound is a universal inequality, predicted by Landauer in 1961 and confirmed by Berut et al. 2012, so it applies to cells as a lower bound. That does not require a separate cellular measurement."
  locked_prediction:
    predicted_by: landauer1961
    confirmed_by: berut2012
  sources:
  - landauer1961
  - berut2012
notes: "ESTABLISHED as a lower bound: erasure causes at least this heat. Cell-side split: (a) 'Cell computation is bounded below by kT ln2 per bit erased' is evidence_rung 3 (a universal inequality, Landauer 1961, confirmed experimentally by Berut et al. 2012, so it applies to cells as a bound) and is the second chain step. (b) 'Cells operate near that bound' / 'cells work near the bound' is evidence_rung 0, with model_exists true and model_refs Mehta & Schwab 2012, and with no measured case. (b) is not claimed and is therefore not a chain step: putting it in the chain would force the overall evidence_rung to 0 and the overall label off ESTABLISHED, understating the bound that is the actual claim. Neural signalling dissipates ≥10^5× kT ln2 per bit transmitted (Laughlin 1998). This is not an erasure measurement, so it does not bear on whether cells work near Landauer's bound. Atlas link l.s10.landauer carries the physics side."
evidence_rung: 3
rung_basis: "Landauer (1961) predicted the k_B T ln 2 bound; Berut et al. (2012) confirmed it experimentally, and the same universal inequality applies to cells as a lower bound."
locked_prediction:
