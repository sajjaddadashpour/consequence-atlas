notes: "Context check only, not a test of PRR: what was KILLED is Koch and Hummel's excited-neutron model, which lies outside standard physics, and PRR neither predicts nor forbids it, so this carries no PRR verdict and does not count toward PRR's own tally. (The atlas has no schema tag for context checks; this wording is the marker.) CH-BBN-NSTAR-1 (Chemist; Physicist assigned and reviewed). Forge files: docs/forge/2026-11-24-chem-bbn-nstar/. Lock f30de3e, A1 f2d3690, A2 89eece1, A2 patch 45f325e, drift-flag note e95528d, run-1 score 0f15451, A2 score b3c1eb0, drift-flag clearance 9fc2211 (Chemist locks repo). Forge verdict KILLED for an excited neutron that couples to photons and stays in thermal balance with the ground state (16 of 24 grid points, all excluded by both Yp and D/H). 8 points (τ_γ = 100 s at ΔE = 10 and 30 keV) are NOT-TESTABLE-YET: they fail the locked thermal-balance cut. Dark-decay and no-photon-coupling variants are not covered; Koch and Hummel specify neither. Our helium at g*/g = 1 (0.392–0.397 when n* beta-decays in 887 s; 0.555–0.575 when it never decays) differs from Silagadze's 0.46–0.49, so REDUCES-TO-KNOWN was not earned. Both numerical predictions were wrong (Physicist about 0.45; Chemist 0.45–0.575 for finite τ_e), though both predicted KILLED. Run 1 showed a 'SURVIVED' half at τ_e = 887 s; that was a detailed-balance flaw in Chemist's lock mapping (the proton-to-neutron rate was not raised to match n*), recorded as a lock artifact and superseded by A2. A 3% drift flag (model n/p against its own equilibrium curve, relative to the SM) was raised at most points and cleared by Physicist: the never-decaying points run the run-1 code unchanged and still drift, and the sign follows the total weak rate. Reading it as freeze-out lag is CONJECTURE. Inputs: PRIMAT rates, full network, τ_n 878.4 s, Ω_b h² 0.02230 (Planck without BBN, as quoted in the PDG 2025 review), N_eff 3.044 from the code. Control matched the PRyMordial paper's Fig. 3 PRIMAT values (Yp 0.24689(11), D/H 2.459(26) × 10⁻⁵) within the locked tolerance. Aver 2021 (Yp 0.2453 ± 0.0034) and Cooke 2018 (D/H 2.527 ± 0.030 × 10⁻⁵) were cross-checks only. Label CONJECTURE because the mapping assumes n* rates scale by τ_g/τ_e in all three weak channels (ASSUMED) and because no non-equilibrium solver was run. Rung 1: a model compared against existing measurements; no intervention."
