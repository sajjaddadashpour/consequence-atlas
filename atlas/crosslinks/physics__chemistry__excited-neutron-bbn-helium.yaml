id: x.physics.excited-neutron-bbn-helium
a:
  field: physics
  pattern: "The neutron lifetime puzzle: beam experiments measure a longer lifetime than bottle experiments (Δτ = 8.6 ± 2.2 s in Koch and Hummel 2024). Koch and Hummel propose that free neutrons fresh from reactions can sit in long-lived excited states n* that beta-decay more slowly and drop to the ground state by photon emission, between beam and bottle timescales."
b:
  field: chemistry
  pattern: "Primordial element abundances left by big-bang nucleosynthesis: helium-4 mass fraction Yp = 0.245 ± 0.003 and D/H = (25.08 ± 0.29) × 10⁻⁶ (PDG 2025 review)."
connection: "If n* couples to photons, the hot early-universe plasma holds it in thermal balance with the ground state, so extra neutron states take part in weak freeze-out (Silagadze 2026). In the open BBN code PRyMordial (Burns, Tait & Valli 2024; commit 725d8a8), with detailed balance enforced on the neutron–proton rates, every testable point gives Yp 0.39–0.81 and D/H 3.5–30 × 10⁻⁵, far outside the measured 2σ ranges (Yp 0.239–0.251, D/H 2.450–2.566 × 10⁻⁵). The standard-model control in the same code gives Yp 0.2469 and D/H 2.454 × 10⁻⁵, inside both. This excludes the thermally coupled version of the excited-neutron idea. It says nothing about an n* that does not couple to photons or that decays into a dark sector. Context check only, not a test of PRR: what was KILLED is Koch and Hummel's excited-neutron model, which lies outside standard physics, and PRR neither predicts nor forbids it, so this carries no PRR verdict and does not count toward PRR's own tally."
label: CONJECTURE
support: mechanism
claim: cause
breaks_if: "A BBN calculation with the same detailed-balance mapping that keeps Yp within 0.239–0.251 and D/H within 2.450–2.566 × 10⁻⁵ for some photon-coupled n* with ΔE ≤ 30 keV in thermal balance; or a demonstration that photon-coupled n* does not reach thermal balance before weak freeze-out over the Koch–Hummel parameter range (as at the 8 untestable points, τ_γ = 100 s at 10–30 keV); or primordial abundance measurements revised to Yp ≥ 0.39."
