notes: "Forge verdict REDUCES-TO-KNOWN (H2-LOCK section 5), carried as a requirement on PRR's +-1 to Hilbert-space map, not a prediction; SURVIVED was not an available outcome. Files: docs/forge/2026-11-23-math-h1-h3/ (H2-LOCK.md, code/h2_count.py, out/h2_output.txt; rerun on the box 2026-11-23, byte-identical). Step 2 is the ASSUMED composition rule (tensor product plus independent sources); the crosslink label set has no ASSUMED, so it is carried as CONJECTURE. The overall label is CONJECTURE because steps 1 and 2 are. Citations re-checked 2026-11-23 against Crossref and the arXiv full texts: Renou arXiv:2101.10873 (T <= 7.6605 for real QT; 'T <= 7.66' in the main text); Chen arXiv:2103.08123 (score 8.09(1); 'beats the real-number bound of 7.66 by 43 standard deviations'); Li arXiv:2111.15128 (W_EXP = 0.8508 +- 0.0218 vs W_RQT ~ 0.7486, '4.70 standard deviations'; abstract says 'over 4.5'). Li et al. did not test the 7.66 bound. The step 3 to step 4 order is a reading chain, not a derivation: the experiments exclude real QT directly. Rung 0: no claim about a real system is made for PRR."
