id: x.prr.complex-amplitudes-required
a:
  field: prr
  pattern: "PRR A1/D2: readings are +1 or -1, and mirrored readings sum to zero. One reading (CONJECTURE) takes +-1 as the phases 0 and pi, the real slice of U(1), so 'mirroring to zero' is destructive interference at phase difference pi."
  refs:
  - prr.a1-directional-alphabet
  - prr.d2-mirroring
b:
  field: physics
  pattern: "Network Bell-type experiments with two independent sources exclude real-amplitude quantum theory when independent systems are combined by the tensor product (Renou et al. 2021; Chen et al. 2022; Li et al. 2022)."
connection: "A REQUIREMENT on PRR, not a PRR prediction. If PRR composes independent systems by the tensor product (ASSUMED; PRR has not stated its composition rule) and its sources are independent, its amplitudes must be complex. Two legs: (1) real amplitudes break local tomography: for two +-1 systems (d=2) a real joint state has 10 parameters but local products span only 9 (10 != 9; normalised 9 vs 8); complex amplitudes give 16 = 4 x 4 (forge H2, code/h2_count.py). (2) Real quantum theory is bounded at T <= 7.66 (7.6605) in the Renou et al. entanglement-swapping test; Chen et al. measured 8.09(1) on superconducting qubits, a 43 standard-deviation violation; Li et al. used a different, tailored inequality on photons (real bound W ~ 0.7486, measured 0.8508 +- 0.0218), a 4.70 standard-deviation violation. Reading +-1 as phases 0 and pi is CONJECTURE."
label: CONJECTURE
support: mathematics
claim: pattern
breaks_if: "Under H2-LOCK: any of the three experimental numbers (bound, score or significance) is materially different on re-read, or the explicit rank count disagrees with 10 vs 9. Separately, the requirement stops binding if PRR states a composition rule that is not the tensor product of independent parts (for example a shared extra rebit or an irreducible Peirce-style pairing): Renou et al. note that real quantum theory reproduces any experiment when parts may share arbitrary real states."
