id: x.prr.spectral-dimension-growth-rules
a:
  field: prr
  pattern: "Candidate PRR locality rules that grow a graph from +-1 pairs: R1 'born together, with closure' (random 2-tree) and R2 stacked-simplex growth (random Apollonian network), which put in no dimension; and, from H11, the same stacking one and two simplex dimensions up (R4a/R4b, R5a/R5b), which put the simplex dimension in by hand. PRR's A1, A2 and D2 do not fix a graph, so only named rules can be tested."
  refs:
  - prr.a1-directional-alphabet
  - prr.d2-mirroring
b:
  field: physics
  pattern: "A geometry that looks four-dimensional at large scale has spectral dimension d_s ~ 4 (return probability of a random walk P(sigma) ~ sigma^(-d_s/2) over a scaling window), as in causal dynamical triangulations (Ambjorn, Jurkiewicz and Loll 2005)."
connection: "None known yet. Forge H3 (Mathematician; lock 218a3a9, outputs a093cf4) measured large-scale d_s with a continuous-time walk at n = 10^5, 3 seeds, band [3.7, 4.3]. R1 (random 2-tree): mean d_s 2.306, KILLED. R2 (random Apollonian): mean d_s 2.600, KILLED. PRR-level: NOT-TESTABLE-YET, because PRR has no locality rule yet. Caveat: both rules make planar graphs by construction, so a result around 2 to 3 says little about higher-dimensional rules. Control R3 (a 4D causal set, which imports d = 4 by hand) gave NO-WINDOW in 3/3 seeds at n = 10^4; it is context only. The instruments passed (Z4 torus 4.125, Z2 torus 2.015). Forge H11 (Mathematician; lock 14e7826, outputs 3b8fd8d), same pipeline and band at n = 10^5: stacked 4-ball R4a (random stacked 4-polytope) mean d_s 3.71 and random 4-tree R4b mean 3.99 are both NOT-TESTABLE-YET (mean in band, but seeds spread from 3.24 to 4.49, R4b seed 3 had no window, and all six R4 runs at n = 10^4 had no window). One dimension up, R5a and R5b are KILLED (no window in 3/3 seeds). PRR level: still NOT-TESTABLE-YET; PRR has no locality rule, and in R4/R5 the simplex dimension is put in by hand, so even an in-band result would not be PRR-distinctive."
label: CONJECTURE
support: mathematics
claim: pattern
breaks_if: "This is open, not a link. A named PRR locality rule with no dimension put in that gives d_s, both half-window fits, and all 3 seeds inside [3.7, 4.3] at its largest locked size would turn it into a positive (still CONJECTURE that the rule is PRR's). R1 and R2 have already failed that test under H3-LOCK. Whether R4a/R4b settle in band needs a new lock at larger n; a rule that imports the simplex dimension can at most show the method sees a dimension put in by hand."
sources:
- ambjorn-jurkiewicz-loll2005
- eichhorn-mizera2014
- zhou-yan-wang2005
status: active
proposed_by: mathematician
notes: "Forge verdicts under H3-LOCK section 6: R1 KILLED (n=10^5 seeds d_s 2.147, 2.294, 2.476), R2 KILLED (2.680, 2.540, 2.581), PRR-level NOT-TESTABLE-YET. At n=10^4, R2 seeds 2 and 3 were SATURATED. The runner prints 'RULE R3: KILLED -- NO-WINDOW in 3/3 seeds'; R3 is the imported-dimension control, so the atlas reports it as NO-WINDOW and draws no PRR conclusion from it (consistent with Eichhorn and Mizera 2014, which the lock cites for nonlocal causal-set links). Files: docs/forge/2026-11-23-math-h1-h3/ (H3-LOCK.md, code/h3_run.py, out/h3_output.txt). REPORT.md calls this item H4. The forge verdict words are recorded here, not as atlas labels. H11 (H11-LOCK section 4, scored at n = 10^5): R4a seeds d_s 3.924, 3.239, 3.971 (seed 2 and halves out of band); R4b seeds 3.489, 4.485, NO-WINDOW (mean of the two OK seeds 3.987); at n = 10^4, R4a one SATURATED and two NO-WINDOW, R4b three NO-WINDOW; R5a and R5b NO-WINDOW in all 12 runs. Instruments reproduced the H3 values bit for bit. Physicist's prediction recorded at lock was all four KILLED with d_s below 3.7 (R4 about 2.9, R5 about 3.2); for R4 that was wrong, since both R4 rules landed in band on the mean. Three noisy points (R2, R4, R5) are not evidence of a trend with simplex dimension; no such trend is claimed here. Files: docs/forge/2026-11-23-math-h6-h11/ (H11-LOCK.md, code/h11_run.py, code/h3_run.py byte-identical to 218a3a9, out/h11_output.txt). Only the H11 smoke test was rerun on the box. Rung 0: no claim about a real system."
