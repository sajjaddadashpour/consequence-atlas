notes: "Forge verdicts under H3-LOCK section 6: R1 KILLED (n=10^5 seeds d_s 2.147, 2.294, 2.476), R2 KILLED (2.680, 2.540, 2.581), PRR-level NOT-TESTABLE-YET. At n=10^4, R2 seeds 2 and 3 were SATURATED. The runner prints 'RULE R3: KILLED -- NO-WINDOW in 3/3 seeds'; R3 is the imported-dimension control, so the atlas reports it as NO-WINDOW and draws no PRR conclusion from it (consistent with Eichhorn and Mizera 2014, which the lock cites for nonlocal causal-set links). Files: docs/forge/2026-11-23-math-h1-h3/ (H3-LOCK.md, code/h3_run.py, out/h3_output.txt). REPORT.md calls this item H4. The forge verdict words are recorded here, not as atlas labels. Rung 0: no claim about a real system."
