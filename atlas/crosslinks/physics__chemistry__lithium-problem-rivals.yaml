notes: "Forge run 2026-11-23-0100-lithium-relics (Physicist; lock 55b1252, results f099ddf): verdict REDUCES-TO-KNOWN. P1 SURVIVED (cascade cutoff reaches the D threshold at T = 5.34 keV, t = 4.64e4 s, 0.93 x the paper's 5e4 s); P2 SURVIVED indirect (neutron-driven Li lowering costs >= 30% of the final D/H, which cascades must remove); P3a KILLED on wording only ('about three times' vs 3.81); P3b SURVIVED (2 of 4 Q-ball rows reach <= 1.95e-10); P3c SURVIVED (max |dNeff| 0.106 / 0.045 = 2.36); P4 SURVIVED (lifetimes 2.25-3.44 h). Stellar depletion added as a rival on Physicist's request from the TOE room (2026-11-23). Korn et al. 2006 (Nature 442, 657-659; doi:10.1038/nature05011) checked against Crossref and the arXiv abstract (astro-ph/0608201): they conclude diffusion is 'predominantly responsible' for the low stellar lithium; their abstract gives the discrepancy as a factor two to three, against 3.81 on the paper's newer numbers. Ovchynnikov 2026 checked on arXiv (2611.26691v1, no journal reference yet). Field b is chemistry because the measured quantity is an element abundance; the record links physics to the atlas's s04 to s05 (nuclei and light elements) input without changing any stage link. Nothing in PRR predicts or constrains this. Rung 1: observed trends, no intervention."
