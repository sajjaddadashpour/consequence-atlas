id: x.physics.lithium-problem-rivals
a:
  field: physics
  pattern: "Standard big-bang nucleosynthesis with the CMB baryon density predicts a primordial lithium-7 abundance 7Li/H = 5.53e-10 (the SBBN value used by Ovchynnikov 2026)."
b:
  field: chemistry
  pattern: "The lithium abundance measured spectroscopically in the atmospheres of old, metal-poor stars is lower: 1.45e-10 (the Particle Data Group value used by Ovchynnikov 2026), a factor 5.53/1.45 = 3.81."
connection: "The gap (the cosmological lithium problem) is open, with two rival explanations that act at different times. (1) Decaying relics, before stars form: relics with lifetimes of a few hours, decaying mostly into ~100 MeV electron antineutrinos plus e+-/photons, turn protons into neutrons that destroy 7Be, and later EM cascades break up the extra deuterium; the paper's Table I rows end at 7Li/H = 1.5 to 2.3e-10 while keeping D/H, YP and Neff in range (Ovchynnikov 2026; forge check REDUCES-TO-KNOWN, standard BBN plus EM-cascade physics). (2) Stellar depletion, inside stars: atomic diffusion with turbulent mixing carries lithium below the visible atmosphere, so old stars show less than they were born with; Korn et al. 2006 report abundance trends with evolutionary stage in the metal-poor globular cluster NGC 6397 that diffusion models reproduce. Neither rival is established here."
label: CONJECTURE
support: mechanism
claim: cause
breaks_if: "For relics: a Neff shift absent at Simons Observatory precision where the paper's rows predict up to +0.106 (about 2.4 sigma at sigma(Neff) = 0.045), or 6Li/7Li limits that exclude the particle rows (the paper's own 5-17% is already above stellar limits). For stellar depletion: lithium abundances in unevolved metal-poor stars that show no trend with evolutionary stage where diffusion models predict one. If stellar depletion fully closes the gap, no relic is needed; if the measured stellar values are confirmed as primordial, the relic reading gains ground."
