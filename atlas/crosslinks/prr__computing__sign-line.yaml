proposed_by: mathematician
notes: "Forge verdicts under H6-LOCK section 4: instrument gate passed; T1a (mean field at n = 10) passed; T1b (theta = pi strict minimum at n = 8, 9, 10 with CI < 0) passed; T2 PASS (|rho| <= 0.6) at n = 9; so the math conjecture is SURVIVED and the PRR level REDUCES-TO-KNOWN. The slogan kill was DERIVED before the run. T2 at n = 7 and 8 (reported, not scored): rho = 0.04 [-0.23, 0.17] and -0.47 [-0.59, -0.18]. Statistic is the median of log(|Z_y|/per), not of log|Z_y|. Easy-point list (0,0), (0,-1), (1,-1) for the Chung-Graham cover polynomial is taken from the Kotek-Makowsky-Ravve survey (verified in its author PDF, section 3.3); the Bläser-Dell and Bläser-Dell-Fouz abstracts say only 'three points are easy'. Unverified (PROPOSALS-errata (c)): whether hardness is proved for all complex y, and whether it holds for unweighted 0/1 digraphs; T1/T2 are numerical and do not depend on either. y = -2 is parity-P-hard by Mertens-Moore, not #P-hard (errata (d)). Independent of the unreviewed VP != VNP claim posted at hexagonmath.org (id 2611.00954v1, not an arXiv id); it is not used as a premise. H6 full locked run reproduced on the box (identical except the timestamp). Files: docs/forge/2026-11-23-math-h6-h11/ (H6-LOCK.md, code/h6_run.py, code/symn.py, out/h6_result.json). The forge verdict words are recorded here, not as atlas labels."
