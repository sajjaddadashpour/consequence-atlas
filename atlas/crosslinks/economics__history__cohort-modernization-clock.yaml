id: x.hist.cohort-modernization-clock
a:
  field: economics
  pattern: "A country-relative modernization clock: a person's birth year measured from the year their own country crossed a development threshold (internet users >= 50%, mobile subscriptions >= 50 per 100, GDP per capita >= 10,000 2011 int$, or gross secondary enrollment >= 50%)."
b:
  field: history
  pattern: "Worldview as measured by six Integrated Values Surveys items, 1981-2022 (trust A165, importance of God F063, post-materialism Y002, left-right E033, justifiability of homosexuality F118, happiness A008), across birth cohorts born 1940-2005."
connection: "Tested Sajjad's TOE-room hypothesis (2026-11-22) that when a person was born best predicts how they see reality. What was tested is worldview as measured by the six IVS items above, not perception. Cohort as the best predictor: KILLED (Historian lock fff88a0, Part A: calendar birth cohort ranked last of four blocks in 5/6 items; country dominated, 57-85% of the partial R2). Calendar year versus a country-relative clock: the internet clock (T50) beat calendar cohort by dBIC <= -10 in 4/6 items (A165 -106.9, F063 -669.8, E033 -146.1, A008 -339.3; calendar won Y002 +48.8 and F118 +103.7). Which clock it is: NOT-TESTABLE-YET on open data (Historian lock ab1fe35: internet won 3/6, income 1/6, 2 ties, on 12 middle-income countries with a clean year on all four clocks). In an unscored check after the verdict, income fit best: on raw fit (-2 log L) income was best on 5/6 items and schooling on A165; internet's BIC wins came from the parameter penalty. That check is post hoc and is not a verdict."
label: CONJECTURE
support: mechanism
claim: pattern
breaks_if: "A new pre-registered test on a larger common sample (or the CHAT technology dataset, not yet used) in which calendar birth cohort beats every country-relative clock by dBIC <= -10 in >= 4 of 6 items would break the 'clock beats calendar' half. 'Which clock' needs a sample where one clock wins >= 4 of 6; income winning would make it REDUCES-TO-KNOWN (Inglehart modernization), internet winning would be new."
sources:
- inglehart-baker2000
- wvs-trend-1981-2022
- evs-trend-za7503
- maddison2023
status: active
proposed_by: historian
notes: "Locks: Historian fff88a0 (birth cohort vs technology) and ab1fe35 (which clock), both on branch historian-locks-1 of this repo (not merged to main). Scores (Physicist forge): 2026-11-22-cohort-tech-score commit 25a0089 (Part A KILLED; Part B TECH 4/6, so the technology branch SURVIVED and the calendar branch KILLED under fff88a0 section 5) and 2026-11-23-cohort-clocks-score commit 7e52619 (NOT-TESTABLE-YET). Knife edge in ab1fe35: A008 internet-vs-mobile gap -9.9994 misses the <= -10 rule by 0.0006 BIC; applied as written, it is a tie. In fff88a0 Part B about 64 of each dBIC is BIC's parameter penalty (M_tech has 5 fewer effective parameters); on fit alone tech still wins the same 4/6 items (post-outcome diagnostic). Caveats: rests on ASSUMED common age effects and survey-year fixed effects; Part B uses the 71-77 countries that crossed 50% internet by their last survey, mostly richer ones; with mobile phones as the clock there is no winner (3/3). Data: WVS Trend v4.1 file (the DOI record lists version 4.0) stacked with EVS ZA7503 v3.0.0; World Bank IT.NET.USER.ZS, IT.CEL.SETS.P2, SE.SEC.ENRR; Maddison 2023. Inglehart and Baker 2000 is the seen rival (modernization). Rung 1: an association in survey data; neither lock made a directional prediction that held."
evidence_rung: 1
model_exists: false
