id: l.s05.carbon-nuclei
from: s04.stable-atoms
to: s05.hydrogen-table
label: IMPORTED
condition: 0.1*(1 + strong) >= 0.3*sqrt(alpha)
sources:
- tegmark1998
status: active
notes: 'Carbon and heavier nuclei hold together iff alpha_s >= 0.3*sqrt(alpha), with alpha_s = 0.1 scaled by the strong dial (Tegmark 1998, citing Barrow & Tipler). | CONTESTED NUCLEAR EDGES (Chemist lock C2, informational, do not change this link''s condition): (a) deuteron unbinds at s in [-0.06, -0.04]; (b) diproton binds at s in [+0.06, +0.17]. Ranges are model-dependent: square well -4%/+6%, Yukawa -6%/+17% (Adams, Phys. Rep. 807 (2019), arXiv:1902.03928, sec. 2.4, last paragraph, arXiv PDF p. 31, citing Davies, J. Phys. A 5 (1972) 1296). ASSUMED: nuclear well depth scales linearly with alpha_s, so s = fractional change in alpha_s (as in MacDonald & Mullan 2009, V = G^2 V0, s = G^2 - 1; their diproton binding at G = 1.065 gives s = 0.134, inside (b)). Neither edge fails a universe. Dissent on (a): Adams & Grohs, Astropart. Phys. 91 (2017) 90-104, doi:10.1016/j.astropartphys.2017.03.009 (stars without stable deuterium). Dissent on (b): MacDonald & Mullan, PRD 80, 043507 (2009), arXiv:0904.1807 (primordial H survives for G < 1.5). Stage version kept on branch chemist-c2-stages for a later PR. PRE-EMPTED (slate A1, 2026-11-16): this link FAILs only for alpha > 0.071, where l.s05.hydrogen-stable already FAILs (it FAILs for every alpha > 0.0244 at any beta in range), so it never decides a verdict alone in the current dial ranges.'
