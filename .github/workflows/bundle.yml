name: Bundle

on:
  push:
  pull_request:
  schedule:
    # Nightly, off the hour. The bundle is an artifact, never a commit.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Build dist/atlas-bundle.json
        run: make bundle
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-bundle
          path: dist/atlas-bundle.json
          if-no-files-found: error
