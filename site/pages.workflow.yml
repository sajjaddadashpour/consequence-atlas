name: Pages

# Rebuild the public site on https://toeatlas.si from main.
# The generated tree is published to the gh-pages branch only.
# Merges to main still need an owner's approval; this workflow
# only runs after a commit lands there (or is dispatched by hand).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Build site
        run: python3 site/build.py --out dist/site --cname toeatlas.si
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/site
          branch: gh-pages
          clean: true
          force: false
